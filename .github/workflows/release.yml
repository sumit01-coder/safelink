name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with v (e.g., v1.1.0)
  workflow_dispatch: # Allow manual trigger from the Actions tab

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build Firmware
        run: |
          cd firmware/xiao_esp32s3
          pio run

      - name: Rename APK and Firmware
        id: rename
        run: |
          # If triggered by a tag, use the tag name. Otherwise, default to 'latest'
          TAG_NAME=${GITHUB_REF_NAME:-latest}
          APK_NAME="safelink-${TAG_NAME}.apk"
          
          # Move and rename the APK to the root workspace
          mv app/build/outputs/apk/debug/app-debug.apk $APK_NAME
          
          # Move and rename the firmware
          if [ -f "firmware/xiao_esp32s3/.pio/build/seeed_xiao_esp32s3/firmware.bin" ]; then
            cp firmware/xiao_esp32s3/.pio/build/seeed_xiao_esp32s3/firmware.bin firmware_latest.bin
          else
            echo "Direct path not found, searching in .pio/build..."
            find firmware/xiao_esp32s3/.pio/build -name "firmware.bin" -exec cp {} firmware_latest.bin \;
          fi

          if [ ! -f "firmware_latest.bin" ]; then
            echo "Error: firmware_latest.bin was not created!"
            ls -laR firmware/xiao_esp32s3/.pio/build || true
            exit 1
          fi
          
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SafeLink ${{ steps.rename.outputs.tag_name }}
          body: "Automated release for SafeLink ${{ steps.rename.outputs.tag_name }}."
          files: |
            ${{ steps.rename.outputs.apk_name }}
            firmware_latest.bin
          # Automatically mark as latest
          make_latest: true
